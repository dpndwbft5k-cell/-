<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Лето 2026</title>
  <meta name="description" content="Лето 2026">
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #150f2e;
      font-family: Arial, sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #f2edff;
    }
    .loading {
      padding: 24px 32px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="loading">Загрузка страницы…</div>
  <script>
    (async function () {
      const sourceUrl = 'https://raw.githubusercontent.com/dpndwbft5k-cell/-/main/%D0%9B%D0%B5%D1%82%D0%BE%202026.html';
      try {
        const response = await fetch(sourceUrl, { cache: 'no-store' });
        if (!response.ok) {
          throw new Error('HTTP ' + response.status);
        }
        const html = await response.text();
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const body = doc.body;
        if (body && body.innerHTML) {
          document.documentElement.innerHTML = doc.documentElement.innerHTML;
        } else {
          document.body.innerHTML = '<div style="padding:24px;color:#fff;font-family:Arial,sans-serif;">Не удалось загрузить страницу.</div>';
        }
      } catch (error) {
        document.body.innerHTML = '<div style="padding:24px;color:#fff;font-family:Arial,sans-serif;">Ошибка загрузки страницы: ' + (error && error.message ? error.message : error) + '</div>';
      }
    })();
  </script>
</body>
</html>
